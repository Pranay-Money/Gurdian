global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'guardian'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # Uncomment and configure for Alertmanager
      # - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Guardian API metrics
  - job_name: 'guardian-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'guardian-api'
          environment: 'production'
    # For Fly.io, use service discovery instead:
    # file_sd_configs:
    #   - files:
    #       - '/etc/prometheus/targets/*.json'

  # PostgreSQL exporter (if deployed)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
    # Enable by adding postgres-exporter to docker-compose

  # Redis exporter (if deployed)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
    # Enable by adding redis-exporter to docker-compose

  # Node exporter for host metrics (if deployed)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
    # Enable by adding node-exporter to docker-compose

# Remote write for long-term storage (optional)
# remote_write:
#   - url: "https://prometheus-remote-write.example.com/api/v1/write"
#     basic_auth:
#       username: "user"
#       password: "${REMOTE_WRITE_PASSWORD}"